name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Pylint
        run: uv run pylint app --fail-under=9.0 --persistent=no
      - name: Radon
        run: |
          uv run radon cc app -s -a
          uv run radon mi app -s
