[project]
name = "bolao-profissa"
version = "0.1.0"
description = "Bolao da Copa 2026 reconstruido com arquitetura limpa e fluxo de equipe."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy-libsql>=0.1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "slowapi>=0.1.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pylint>=3.3",
    "radon>=6.0",
]

[project.scripts]
bolao-seed = "app.cli.seed:main"
bolao-sync = "app.cli.sync_fixtures:main"
bolao-recompute-snapshots = "app.cli.recompute_snapshots:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.12"
load-plugins = []

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100

