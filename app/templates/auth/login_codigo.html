{% extends "base.html" %}
{% block title %}Primeiro acesso | Bolão Profissa{% endblock %}
{% block content %}
  <section class="form-card">
    <span class="eyebrow">Primeiro acesso</span>
    <h1>Entrar com <em>código</em></h1>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form class="stack" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Codigo
        <input name="code" autocomplete="one-time-code" required>
      </label>
      <button type="submit">Continuar</button>
    </form>
    <p class="hint"><a href="/login">Já tenho conta</a></p>
  </section>
{% endblock %}
