{% extends "base.html" %}
{% block title %}Completar perfil · Bolao Profissa{% endblock %}
{% block content %}
  <section class="panel">
    <h1>Completar perfil</h1>
    {% for error in errors %}<p class="alert">{{ error }}</p>{% endfor %}
    <form class="stack" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Nickname
        <input name="nickname" value="{{ user.nickname }}" required>
      </label>
      <label>Nome completo
        <input name="nome_completo" value="{{ user.nome_completo or '' }}">
      </label>
      <label>Senha
        <input name="senha" type="password" autocomplete="new-password" required>
      </label>
      <button type="submit">Salvar perfil</button>
    </form>
  </section>
{% endblock %}
