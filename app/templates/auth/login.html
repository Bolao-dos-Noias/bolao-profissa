{% extends "base.html" %}
{% block title %}Entrar | Bolão Profissa{% endblock %}
{% block content %}
  <section class="login-single">
  <div class="form-card">
    <span class="eyebrow">Já tem conta</span>
    <h1>Logar <em>direto</em></h1>
    {% if registered %}<p class="ok">Cadastro concluido. Entre com nickname e senha.</p>{% endif %}
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form class="stack" method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Nickname
        <input name="nickname" value="{{ nickname_value or '' }}" autocomplete="username" required>
      </label>
      <label>Senha
        <input name="senha" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </div>
  <a class="cta cta--ghost login-switch" href="/login/codigo">criar conta com código</a>
  </section>
{% endblock %}
