{% extends "base.html" %}
{% block title %}Trocar senha | Bolao Profissa{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Trocar senha</h1>
    {% if errors %}
      <ul class="alert-list">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    {% endif %}
    <form class="stack" method="post" action="/perfil/senha" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Senha atual
        <input name="senha_atual" type="password" required maxlength="72" autocomplete="current-password">
      </label>
      <label>Nova senha
        <input name="senha_nova" type="password" required maxlength="72" autocomplete="new-password">
      </label>
      <label>Confirmar nova senha
        <input name="senha_nova_confirma" type="password" required maxlength="72" autocomplete="new-password">
      </label>
      <button type="submit">Salvar</button>
    </form>
  </section>
{% endblock %}
