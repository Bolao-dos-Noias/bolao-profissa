{% extends "base.html" %}
{% block title %}Trocar nickname | Bolão Profissa{% endblock %}
{% block content %}
  <section class="form-card">
    <span class="eyebrow">Perfil</span>
    <h1>Trocar <em>nickname</em></h1>
    {% if errors %}
      <ul class="alert-list">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    {% endif %}
    <form class="stack" method="post" action="/perfil/nickname">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Nickname
        <input name="nickname" type="text" required minlength="2" maxlength="30" value="{{ nickname or user.nickname or '' }}">
      </label>
      <label>Senha atual
        <input name="senha_atual" type="password" required maxlength="72" autocomplete="current-password">
      </label>
      <button type="submit">Salvar</button>
    </form>
  </section>
{% endblock %}
