{% extends "base.html" %}
{% block title %}Trocar nome | Bolao Profissa{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Trocar nome</h1>
    {% if errors %}
      <ul class="alert-list">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
    {% endif %}
    <form class="stack" method="post" action="/perfil/nome">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <label>Nome completo
        <input name="nome_completo" type="text" required minlength="2" maxlength="80" value="{{ nome_completo or user.nome_completo or '' }}">
      </label>
      <label>Senha atual
        <input name="senha_atual" type="password" required maxlength="72" autocomplete="current-password">
      </label>
      <button type="submit">Salvar</button>
    </form>
  </section>
{% endblock %}
